<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inspection Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#f0f2f6;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

/* RECORD ICON */
.record-icon{
  width:120px;
  height:120px;
  background:linear-gradient(135deg,#0077cc,#0a2b4f);
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  color:#fff;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  transition:.3s;
}
.record-icon:hover{
  transform:scale(1.08);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
}

.modal-content{
  background:#fff;
  width:92%;
  max-width:900px;
  max-height:90vh;
  border-radius:18px;
  padding:24px;
  overflow:hidden;
  animation:pop .3s ease;
}

@keyframes pop{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #eee;
  padding-bottom:10px;
}

.modal-header h2{
  margin:0;
  color:#0a2b4f;
}

.close{
  font-size:28px;
  cursor:pointer;
}

/* RECORD LIST */
.records{
  margin-top:15px;
  overflow-y:auto;
  max-height:70vh;
}

.card{
  background:#f9fbfd;
  border-left:6px solid #0077cc;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card strong{
  color:#0a2b4f;
}

.small{
  font-size:13px;
  color:#555;
}

.checklist{
  margin-top:10px;
  font-size:13px;
}
.checklist div{
  margin-bottom:4px;
}
</style>
</head>

<body>

<!-- ICON -->
<div class="record-icon" onclick="openModal()">📋</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Inspection Records</h2>
      <div class="close" onclick="closeModal()">✖</div>
    </div>

    <div class="records" id="recordsList">
      <p>Loading records…</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
 apiKey:"AIzaSyD1IrZScZZOZXEkWBM8WUDhKrnSTM89TIY",
 authDomain:"selelo-tracker.firebaseapp.com",
 databaseURL:"https://selelo-tracker-default-rtdb.firebaseio.com",
 projectId:"selelo-tracker",
 storageBucket:"selelo-tracker.firebasestorage.app",
 messagingSenderId:"42660826905",
 appId:"1:42660826905:web:b3074d71e00e2e0b9fbf88"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const recordsRef = ref(db,"inspections");
const list = document.getElementById("recordsList");

onValue(recordsRef,snap=>{
  list.innerHTML="";
  const data = snap.val();
  if(!data){
    list.innerHTML="<p>No records found.</p>";
    return;
  }

  Object.values(data).reverse().forEach(r=>{
    const card = document.createElement("div");
    card.className="card";

    const checklist = r.checklist.map(c =>
      `<div>• ${c.item}: ${c.present ? "✓" : "✗"} (${c.note || "OK"})</div>`
    ).join("");

    card.innerHTML = `
      <strong>${r.driver}</strong> — ${r.truck}<br>
      <span class="small">${r.company} | ${r.date} (${r.timeIn} → ${r.timeOut})</span>
      <div class="checklist">${checklist}</div>
    `;
    list.appendChild(card);
  });
});

window.openModal = ()=> modal.style.display="flex";
window.closeModal = ()=> modal.style.display="none";
</script>

</body>
</html>
