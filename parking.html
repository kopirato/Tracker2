<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kitengela Car Park - Inspection Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary-dark: #0a2b4f;
  --primary-blue: #0077cc;
  --accent-green: #28a745;
  --text-dark: #333;
  --bg-light: #f0f2f6;
  --white: #fff;
  --border-color: #ccc;
  --shadow-color: rgba(0,0,0,0.15);
  --hover-shadow: rgba(0,119,204,0.2);
}

body {
  margin: 0;
  background: var(--bg-light);
  font-family: 'Inter', sans-serif;
  color: var(--text-dark);
  line-height: 1.6;
}

.navbar {
  background: linear-gradient(90deg, var(--primary-dark), var(--primary-blue));
  display: flex;
  justify-content: space-around;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 12px var(--shadow-color);
}

.navbar a {
  color: var(--white);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s ease;
}

.navbar a:hover {
  color: #ffd700; /* Gold for hover to add luxury corporate feel */
}

.app {
  max-width: 950px;
  margin: 30px auto;
  background: var(--white);
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 12px 30px var(--shadow-color);
  transition: box-shadow 0.3s ease;
}

.app:hover {
  box-shadow: 0 16px 40px var(--hover-shadow);
}

h2 {
  text-align: center;
  color: var(--primary-dark);
  border-bottom: 3px solid var(--primary-blue);
  padding-bottom: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.form-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.field {
  flex: 1;
  min-width: 220px;
}

label {
  font-weight: 600;
  font-size: 14px;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  box-sizing: border-box;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

input:focus {
  border-color: var(--primary-blue);
  box-shadow: 0 0 8px var(--hover-shadow);
  outline: none;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 12px var(--shadow-color);
}

th, td {
  border: 1px solid #ddd;
  padding: 12px;
  text-align: left;
}

th {
  background: linear-gradient(180deg, #f0f4f8, #e0e8f0);
  font-weight: 600;
}

th:nth-child(2), td:nth-child(2) {
  text-align: center;
}

table input[type="text"] {
  border: none;
  background: transparent;
  width: 100%;
}

table input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary-blue);
}

.buttons {
  margin: 30px 0;
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  padding: 14px 24px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px var(--hover-shadow);
}

.save {
  background: var(--primary-blue);
  color: var(--white);
}

.download {
  background: var(--accent-green);
  color: var(--white);
}

.print {
  background: #444;
  color: var(--white);
}

.logo-img {
  width: 100%;
  height: auto;
  display: block;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 8px 20px var(--shadow-color);
  object-fit: cover;
  filter: brightness(1.05) contrast(1.1); /* Enhance quality appearance */
  transition: filter 0.3s ease;
}

.logo-img:hover {
  filter: brightness(1.1) contrast(1.15);
}

p {
  font-size: 14px;
  color: #666;
  margin-bottom: 12px;
}

@media screen and (max-width: 768px) {
  .app {
    margin: 15px;
    padding: 20px;
    border-radius: 10px;
  }

  .form-row {
    flex-direction: column;
    gap: 10px;
  }

  .field {
    min-width: auto;
  }

  .navbar {
    flex-wrap: wrap;
    justify-content: center;
    padding: 10px;
  }

  .navbar a {
    margin: 5px;
  }

  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }

  th, td {
    padding: 8px;
  }

  .buttons {
    flex-direction: column;
    gap: 10px;
  }

  button {
    width: 100%;
    padding: 12px;
  }

  h2 {
    font-size: 1.5em;
  }

  label {
    font-size: 13px;
  }

  input {
    padding: 8px;
  }
}

@media print {
  .buttons, .navbar { display: none; }
  .app { box-shadow: none; margin: 0; padding: 0; border-radius: 0; }
  input { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; }
  input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 15px; height: 15px; border: 1px solid #ddd; }
  input[type="checkbox"]:checked:before { content: '✓'; display: block; text-align: center; line-height: 15px; font-size: 12px; color: #000; }
  table { box-shadow: none; }
  .logo-img { box-shadow: none; filter: none; }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html"> Home</a>
  <a href="records.html"> Records</a>
  <a href="reports.html"> Reports</a>
</div>

<div class="app" id="formArea">
<img src="carwash.jpg" alt="Kitengela Car Park" class="logo-img">

<h2>Driver Information & Vehicle Inspection Template</h2>

<div class="form-row">
  <div class="field"><label>Driver Name</label><input id="driver" value="Xyz"></div>
</div>

<div class="form-row">
  <div class="field"><label>Date</label><input type="date" id="date" value="2026-02-06"></div>
  <div class="field"><label>Time In</label><input type="time" id="timeIn" value="00:01"></div>
  <div class="field"><label>Time Out</label><input type="time" id="timeOut" value="11:01"></div>
</div>

<div class="form-row">
  <div class="field"><label>Truck Number</label><input id="truck" value="KCD214R"></div>
  <div class="field"><label>Company Name</label><input id="company" value="Xcv"></div>
</div>

<div class="form-row">
  <div class="field"><label>Phone Number</label><input id="phone" value="0743000000"></div>
  <div class="field"><label>Email (Optional)</label><input id="email" value="Ccccs@mail.com"></div>
</div>

<p>Please tick (/) or mark condition where applicable</p>

<table id="checklist">
<tr><th>Item</th><th>Present (/)</th><th>Condition / Notes</th></tr>
<tr><td>Battery</td><td><input type="checkbox" checked></td><td><input type="text"></td></tr>
<tr><td>Wheel Spanner</td><td><input type="checkbox" checked></td><td><input type="text"></td></tr>
<tr><td>Jack</td><td><input type="checkbox" checked></td><td><input type="text"></td></tr>
<tr><td>Spare Wheel</td><td><input type="checkbox" checked></td><td><input type="text"></td></tr>
<tr><td>Any Dents / Damages</td><td><input type="checkbox" checked></td><td><input type="text"></td></tr>
</table>

</div>

<div class="buttons">
<button class="save" onclick="saveData()"> Save</button>
<button class="download" onclick="downloadImage()"> Image</button>
<button class="print" onclick="window.print()"> Print</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/*  NEW FIREBASE PROJECT */
const firebaseConfig = {
  apiKey: "AIzaSyB1_XDySLab5nhIcM-EhaV59ewtbjGOmQs",
  authDomain: "parking-b279f.firebaseapp.com",
  databaseURL: "https://parking-b279f-default-rtdb.firebaseio.com",
  projectId: "parking-b279f",
  storageBucket: "parking-b279f.firebasestorage.app",
  messagingSenderId: "718698334788",
  appId: "1:718698334788:web:549a3fc934233daa838a11"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveData = () => {
  const driver = document.getElementById('driver');
  const date = document.getElementById('date');
  const timeIn = document.getElementById('timeIn');
  const timeOut = document.getElementById('timeOut');
  const truck = document.getElementById('truck');
  const company = document.getElementById('company');
  const phone = document.getElementById('phone');
  const email = document.getElementById('email');
  const rows = [...document.querySelectorAll("#checklist tr")].slice(1);
  const checklist = rows.map(r => ({
    item: r.cells[0].innerText,
    present: r.cells[1].querySelector("input").checked,
    note: r.cells[2].querySelector("input").value
  }));

  const record = {
    driver: driver.value,
    date: date.value,
    timeIn: timeIn.value,
    timeOut: timeOut.value,
    truck: truck.value,
    company: company.value,
    phone: phone.value,
    email: email.value,
    checklist,
    createdAt: Date.now()
  };

  push(ref(db,"inspections"), record)
    .then(()=>alert(" Saved successfully"))
    .catch(err=>alert(" " + err.message));
};

window.downloadImage = () => {
  html2canvas(formArea,{scale:2}).then(c=>{
    const a=document.createElement("a");
    a.download="inspection.png";
    a.href=c.toDataURL();
    a.click();
  });
};
</script>

</body>
</html>
