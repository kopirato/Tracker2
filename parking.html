<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Information & Vehicle Inspection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#eaeaea;
  font-family: Arial, Helvetica, sans-serif;
  color:#000;
}

/* MAIN DOCUMENT */
.app{
  width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px 24px 30px;
  border:1px solid #bbb;
}

/* HEADER IMAGE */
.header img{
  width:100%;
  height:140px;
  object-fit:contain;
  margin-bottom:12px;
}

/* TITLE */
h2{
  text-align:center;
  font-size:22px;
  font-weight:700;
  margin:10px 0 20px;
  padding-bottom:8px;
  border-bottom:2px solid #1f3b63;
  color:#1f3b63;
}

/* FORM */
label{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
  display:block;
}

input{
  width:100%;
  padding:8px 10px;
  font-size:14px;
  border:1px solid #bbb;
  border-radius:4px;
  background:#f5f5f5;
}

/* GRID */
.form-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:18px;
  margin-bottom:14px;
}

.form-row.two{
  grid-template-columns:1fr 1fr;
}

.form-row.one{
  grid-template-columns:1fr;
}

/* CHECKLIST */
.section-title{
  margin-top:20px;
  font-size:18px;
  font-weight:700;
}

.note{
  font-size:14px;
  margin-bottom:8px;
}

table{
  width:100%;
  border-collapse:collapse;
  border:2px solid #444;
}

th, td{
  border:1px solid #444;
  padding:10px;
  font-size:14px;
}

th{
  background:#f2f2f2;
  font-weight:700;
  text-align:center;
}

td:first-child{ width:35%; }
td:nth-child(2){ width:15%; text-align:center; }
td:nth-child(3){ width:50%; }

td input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:#000;
}

td input[type="text"]{
  border:none;
  background:transparent;
  width:100%;
  outline:none;
}

/* SIGNATURE AREA */
.signature{
  margin-top:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.sig-line{
  border-top:1px solid #000;
  padding-top:6px;
  font-size:14px;
}

/* PRINT PERFECT */
@media print{
  body{background:#fff}
  .app{border:none;margin:0}
}
</style>
</head>

<body>

<div class="app" id="formArea">

  <!-- HEADER IMAGE -->
  <div class="header">
    <img src="carwash.jpg" alt="Car Wash Header">
  </div>

  <!-- TITLE -->
  <h2>Driver Information & Vehicle Inspection Template</h2>

  <!-- DRIVER -->
  <div class="form-row one">
    <div>
      <label>Driver Name</label>
      <input>
    </div>
  </div>

  <!-- DATE / TIME -->
  <div class="form-row">
    <div>
      <label>Date</label>
      <input type="date">
    </div>
    <div>
      <label>Time In</label>
      <input type="time">
    </div>
    <div>
      <label>Time Out</label>
      <input type="time">
    </div>
  </div>

  <!-- VEHICLE -->
  <div class="form-row two">
    <div>
      <label>Truck Number</label>
      <input>
    </div>
    <div>
      <label>Company Name</label>
      <input>
    </div>
  </div>

  <!-- CONTACT -->
  <div class="form-row two">
    <div>
      <label>Phone Number</label>
      <input>
    </div>
    <div>
      <label>Email (Optional)</label>
      <input>
    </div>
  </div>

  <!-- CHECKLIST -->
  <div class="section-title">Vehicle Checklist</div>
  <div class="note">Please tick (✓) or indicate condition</div>

  <table>
    <tr>
      <th>Item</th>
      <th>Present (✓)</th>
      <th>Condition / Notes</th>
    </tr>
    <tr>
      <td>Battery</td>
      <td><input type="checkbox"></td>
      <td><input type="text"></td>
    </tr>
    <tr>
      <td>Wheel Spanner</td>
      <td><input type="checkbox"></td>
      <td><input type="text"></td>
    </tr>
    <tr>
      <td>Jack</td>
      <td><input type="checkbox"></td>
      <td><input type="text"></td>
    </tr>
    <tr>
      <td>Spare Wheel</td>
      <td><input type="checkbox"></td>
      <td><input type="text"></td>
    </tr>
    <tr>
      <td>Dents / Damages</td>
      <td><input type="checkbox"></td>
      <td><input type="text"></td>
    </tr>
  </table>

  <!-- SIGNATURES -->
  <div class="signature">
    <div class="sig-line">Driver Signature</div>
    <div class="sig-line">Inspector Signature</div>
  </div>

</div>

</body>
</html>
