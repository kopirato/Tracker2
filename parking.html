<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kitengela Car Park - Inspection Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- HTML2CANVAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* BASE */

body{
    margin:0;
    background:#f2f4f8;
    font-family:"Segoe UI", Arial, sans-serif;
}

/* MAIN CONTAINER */

.app{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:20px;
}

.header img{
    width:100%;
    max-height:160px;
    object-fit:contain;
}

/* TITLE */

h2{
    text-align:center;
    margin:10px 0 25px;
    color:#0a2b4f;
    border-bottom:2px solid #0a2b4f;
    padding-bottom:10px;
}

/* FORM */

.form-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.field{
    flex:1;
    min-width:200px;
}

label{
    font-weight:600;
    font-size:14px;
    color:#333;
}

input{
    width:100%;
    padding:8px 10px;
    margin-top:4px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#0077cc;
}

/* CHECKLIST */

.section-title{
    margin-top:25px;
    font-size:18px;
    font-weight:bold;
    color:#0a2b4f;
}

.note{
    margin:5px 0 12px;
    color:#555;
    font-size:14px;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #333;
    padding:10px;
}

th{
    background:#f0f3f7;
}

td input{
    border:none;
    width:100%;
    padding:5px;
}

.check{
    width:18px;
    height:18px;
}

/* BUTTONS */

.buttons{
    margin-top:25px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:0.2s;
}

.save{
    background:#0077cc;
    color:white;
}

.save:hover{
    background:#005fa3;
}

.download{
    background:#28a745;
    color:white;
}

.download:hover{
    background:#1e7e34;
}

.print{
    background:#444;
    color:white;
}

.print:hover{
    background:black;
}

/* PRINT */

@media print{

    body{
        background:white;
    }

    .buttons{
        display:none;
    }

    .app{
        box-shadow:none;
        margin:0;
    }
}

</style>
</head>

<body>


<div class="app" id="formArea">

    <!-- HEADER -->

    <div class="header">
        <img src="carwash.jpg" alt="Kitengela Car Park">
    </div>

    <h2>Driver Information & Vehicle Inspection Template</h2>


    <!-- DRIVER INFO -->

    <div class="form-row">
        <div class="field">
            <label>Driver Name</label>
            <input id="driver">
        </div>
    </div>


    <div class="form-row">

        <div class="field">
            <label>Date</label>
            <input type="date" id="date">
        </div>

        <div class="field">
            <label>Time In</label>
            <input type="time" id="timeIn">
        </div>

        <div class="field">
            <label>Time Out</label>
            <input type="time" id="timeOut">
        </div>

    </div>


    <div class="form-row">

        <div class="field">
            <label>Truck Number</label>
            <input id="truck">
        </div>

        <div class="field">
            <label>Company Name</label>
            <input id="company">
        </div>

    </div>


    <div class="form-row">

        <div class="field">
            <label>Phone Number</label>
            <input id="phone">
        </div>

        <div class="field">
            <label>Email (Optional)</label>
            <input id="email">
        </div>

    </div>


    <!-- CHECKLIST -->

    <div class="section-title">Vehicle Checklist</div>

    <div class="note">
        Please tick (✓) or mark condition where applicable
    </div>


    <table>

        <tr>
            <th width="35%">Item</th>
            <th width="15%">Present (✓)</th>
            <th width="50%">Condition / Notes</th>
        </tr>

        <tr>
            <td>Battery</td>
            <td><input type="checkbox" class="check"></td>
            <td><input></td>
        </tr>

        <tr>
            <td>Wheel Spanner</td>
            <td><input type="checkbox" class="check"></td>
            <td><input></td>
        </tr>

        <tr>
            <td>Jack</td>
            <td><input type="checkbox" class="check"></td>
            <td><input></td>
        </tr>

        <tr>
            <td>Spare Wheel</td>
            <td><input type="checkbox" class="check"></td>
            <td><input></td>
        </tr>

        <tr>
            <td>Any Dents / Damages</td>
            <td><input type="checkbox" class="check"></td>
            <td><input></td>
        </tr>

    </table>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <button class="save" onclick="saveData()">
        💾 Save Details
    </button>

    <button class="download" onclick="downloadImage()">
        📥 Download Image
    </button>

    <button class="print" onclick="window.print()">
        🖨️ Print
    </button>

</div>



<!-- FIREBASE + CLOUD SAVE -->

<script type="module">

/* IMPORT FIREBASE */

import { initializeApp } from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyD1IrZScZZOZXEkWBM8WUDhKrnSTM89TIY",
  authDomain: "selelo-tracker.firebaseapp.com",
  databaseURL: "https://selelo-tracker-default-rtdb.firebaseio.com",
  projectId: "selelo-tracker",
  storageBucket: "selelo-tracker.firebasestorage.app",
  messagingSenderId: "42660826905",
  appId: "1:42660826905:web:b3074d71e00e2e0b9fbf88",
  measurementId: "G-PEV5LDMWB5"

};


/* INIT FIREBASE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* SAVE TO CLOUD */

window.saveData = function(){

    let checklist = [];

    document.querySelectorAll("table tr").forEach((row,i)=>{

        if(i===0) return;

        const item = row.cells[0].innerText;

        const checked =
            row.cells[1].querySelector("input").checked;

        const note =
            row.cells[2].querySelector("input").value;

        checklist.push({
            item,
            checked,
            note
        });

    });


    const record = {

        driver: document.getElementById("driver").value,
        date: document.getElementById("date").value,
        timeIn: document.getElementById("timeIn").value,
        timeOut: document.getElementById("timeOut").value,
        truck: document.getElementById("truck").value,
        company: document.getElementById("company").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,

        checklist: checklist,

        createdAt: new Date().toISOString()

    };


    const recordsRef = ref(db,"inspections");


    push(recordsRef,record)
    .then(()=>{

        alert("Saved to cloud successfully ☁️✔️");

    })
    .catch((err)=>{

        alert("Error: " + err.message);

    });

};


/* DOWNLOAD AS IMAGE */

window.downloadImage = function(){

    const form = document.getElementById("formArea");

    html2canvas(form,{scale:2}).then(canvas=>{

        const link = document.createElement("a");

        link.download = "vehicle-inspection.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

};

</script>


</body>
</html>
