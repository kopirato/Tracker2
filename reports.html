<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kitengela Car Park - Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<style>
:root {
  --primary-dark: #0a2b4f;
  --primary-blue: #0077cc;
  --accent-green: #28a745;
  --text-dark: #333;
  --bg-light: #f0f2f6;
  --white: #fff;
  --border-color: #ccc;
  --shadow-color: rgba(0,0,0,0.15);
  --hover-shadow: rgba(0,119,204,0.2);
}

body {
  margin: 0;
  background: var(--bg-light);
  font-family: 'Inter', sans-serif;
  color: var(--text-dark);
  line-height: 1.6;
}

.navbar {
  background: linear-gradient(90deg, var(--primary-dark), var(--primary-blue));
  display: flex;
  justify-content: space-around;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 12px var(--shadow-color);
}

.navbar a {
  color: var(--white);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s ease;
}

.navbar a:hover {
  color: #ffd700;
}

.app {
  max-width: 1200px;
  margin: 30px auto;
  background: var(--white);
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 12px 30px var(--shadow-color);
  transition: box-shadow 0.3s ease;
  position: relative;
}

.app.loading::after {
  content: 'Loading...';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 20px;
  color: var(--primary-blue);
}

.app:hover {
  box-shadow: 0 16px 40px var(--hover-shadow);
}

h2 {
  text-align: center;
  color: var(--primary-dark);
  border-bottom: 3px solid var(--primary-blue);
  padding-bottom: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.filter-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.field {
  flex: 1;
  min-width: 200px;
}

label {
  font-weight: 600;
  font-size: 14px;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  box-sizing: border-box;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: #f0f4f8;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 4px 12px var(--shadow-color);
}

.stat-card h3 {
  font-size: 24px;
  color: var(--primary-blue);
  margin-bottom: 5px;
}

.stat-card p {
  font-size: 14px;
  color: #666;
}

.chart-container {
  margin-bottom: 30px;
}

#reportsTable {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 30px;
}

#reportsTable th, #reportsTable td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: left;
}

#reportsTable th {
  background-color: #f2f2f2;
}

.buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  padding: 14px 24px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px var(--hover-shadow);
}

.export-csv {
  background: var(--accent-green);
  color: var(--white);
}

.export-pdf {
  background: var(--primary-blue);
  color: var(--white);
}

@media screen and (max-width: 768px) {
  .app {
    margin: 15px;
    padding: 20px;
  }

  .filter-row {
    flex-direction: column;
  }

  .stats-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html"> Home</a>
  <a href="records.html"> Records</a>
  <a href="reports.html"> Reports</a>
</div>

<div class="app" id="reportArea">

<h2>Inspection Reports</h2>

<div class="filter-row">
  <div class="field"><label>From Date</label><input type="date" id="fromDate"></div>
  <div class="field"><label>To Date</label><input type="date" id="toDate"></div>
  <button onclick="generateReports()" style="background: #444; color: #fff;">Generate</button>
</div>

<div class="stats-grid" id="statsGrid"></div>

<table id="reportsTable">
  <thead>
    <tr>
      <th>Category</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody id="reportsBody"></tbody>
</table>

<div class="chart-container">
  <canvas id="issuesChart"></canvas>
</div>

<div class="chart-container">
  <canvas id="companyChart"></canvas>
</div>

<div class="chart-container">
  <canvas id="timeChart"></canvas>
</div>

<div class="chart-container">
  <canvas id="predictionChart"></canvas>
</div>

<div class="buttons">
  <button class="export-csv" onclick="exportToCSV()"> Export CSV</button>
  <button class="export-pdf" onclick="exportToPDF()"> Export PDF</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1_XDySLab5nhIcM-EhaV59ewtbjGOmQs",
  authDomain: "parking-b279f.firebaseapp.com",
  databaseURL: "https://parking-b279f-default-rtdb.firebaseio.com",
  projectId: "parking-b279f",
  storageBucket: "parking-b279f.firebasestorage.app",
  messagingSenderId: "718698334788",
  appId: "1:718698334788:web:549a3fc934233daa838a11"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const recordsRef = ref(db, 'inspections');

let allData = [];
let issuesChart, companyChart, timeChart, predictionChart;

onValue(recordsRef, (snapshot) => {
  allData = Object.values(snapshot.val() || {}).filter(r => r.date && r.checklist);
  generateReports(); // Initial load
});

function createTimeSeriesData(counts, seqLength) {
  const xs = [];
  const ys = [];
  for (let i = seqLength; i < counts.length; i++) {
    xs.push(counts.slice(i - seqLength, i).map(c => [c]));
    ys.push([counts[i]]);
  }
  return {xs: tf.tensor3d(xs), ys: tf.tensor2d(ys)};
}

async function trainLSTMModel(xs, ys) {
  const model = tf.sequential();
  model.add(tf.layers.lstm({units: 50, returnSequences: true, inputShape: [null, 1]}));
  model.add(tf.layers.dropout({rate: 0.2}));
  model.add(tf.layers.lstm({units: 50}));
  model.add(tf.layers.dense({units: 1}));

  model.compile({optimizer: tf.train.adam(0.01), loss: 'meanSquaredError'});

  await model.fit(xs, ys, {
    epochs: 200,
    validationSplit: 0.2,
    callbacks: {
      onEpochEnd: (epoch, log) => {
        if (epoch % 50 === 0) console.log(`Epoch ${epoch}: loss = ${log.loss}, val_loss = ${log.val_loss}`);
      }
    }
  });

  return model;
}

window.generateReports = async () => {
  const reportArea = document.getElementById('reportArea');
  reportArea.classList.add('loading');
  try {
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value || '2026-02-08'; // Current date
    let filteredData = allData;

    if (fromDate) filteredData = filteredData.filter(r => r.date >= fromDate);
    if (toDate) filteredData = filteredData.filter(r => r.date <= toDate);

    // Calculate stats
    const totalInspections = filteredData.length;
    let totalDuration = 0;
    const issues = { Battery: 0, 'Wheel Spanner': 0, Jack: 0, 'Spare Wheel': 0, 'Any Dents / Damages': 0 };
    const companyCounts = {};
    const truckIssues = {};
    const dateCounts = {};
    
    filteredData.forEach(record => {
      if (record.timeIn && record.timeOut) {
        const inTime = new Date(`2000-01-01T${record.timeIn}`);
        const outTime = new Date(`2000-01-01T${record.timeOut}`);
        totalDuration += (outTime - inTime) / (1000 * 60); // minutes
      }
      if (record.checklist) {
        record.checklist.forEach(item => {
          if (!item.present) {
            issues[item.item] = (issues[item.item] || 0) + 1;
            truckIssues[record.truck] = (truckIssues[record.truck] || 0) + 1;
          }
        });
      }
      companyCounts[record.company] = (companyCounts[record.company] || 0) + 1;
      dateCounts[record.date] = (dateCounts[record.date] || 0) + 1;
    });

    const avgDuration = totalInspections ? (totalDuration / totalInspections).toFixed(2) : 0;
    const totalIssues = Object.values(issues).reduce((a, b) => a + b, 0);
    const topCompany = Object.entries(companyCounts).sort((a, b) => b[1] - a[1])[0] || ['N/A', 0];
    const riskTrucks = Object.entries(truckIssues).sort((a, b) => b[1] - a[1]).slice(0, 3).map(t => `${t[0]} (${t[1]} issues)`).join(', ');

    // Display stats
    const statsGrid = document.getElementById('statsGrid');
    statsGrid.innerHTML = `
      <div class="stat-card"><h3>${totalInspections}</h3><p>Total Inspections</p></div>
      <div class="stat-card"><h3>${avgDuration} min</h3><p>Avg Parking Duration</p></div>
      <div class="stat-card"><h3>${totalIssues}</h3><p>Total Issues</p></div>
      <div class="stat-card"><h3>${topCompany[1]}</h3><p>Top Company: ${topCompany[0]}</p></div>
      <div class="stat-card"><h3>${Object.keys(truckIssues).length}</h3><p>Trucks with Issues</p></div>
    `;

    // Reports Table
    const reportsBody = document.getElementById('reportsBody');
    reportsBody.innerHTML = `
      <tr><td>Top Risk Trucks</td><td>${riskTrucks || 'None'}</td></tr>
      <tr><td>Compliance Rate</td><td>${totalInspections ? ((totalInspections - Object.keys(truckIssues).length) / totalInspections * 100).toFixed(2) + '%' : 'N/A'}</td></tr>
      <tr><td>Average Issues per Inspection</td><td>${totalInspections ? (totalIssues / totalInspections).toFixed(2) : '0'}</td></tr>
    `;

    // Issues Bar Chart
    if (issuesChart) issuesChart.destroy();
    issuesChart = new Chart(document.getElementById('issuesChart'), {
      type: 'bar',
      data: { labels: Object.keys(issues), datasets: [{ label: 'Missing Items', data: Object.values(issues), backgroundColor: '#0077cc' }] },
      options: { scales: { y: { beginAtZero: true } }, plugins: { title: { display: true, text: 'Common Vehicle Issues' } } }
    });

    // Company Pie Chart
    if (companyChart) companyChart.destroy();
    companyChart = new Chart(document.getElementById('companyChart'), {
      type: 'pie',
      data: { labels: Object.keys(companyCounts), datasets: [{ data: Object.values(companyCounts), backgroundColor: ['#0077cc', '#28a745', '#ff7733', '#6a1b9a', '#ab47bc'] }] },
      options: { plugins: { title: { display: true, text: 'Inspections by Company' } } }
    });

    // Inspections Over Time Line Chart
    const sortedDates = Object.keys(dateCounts).sort();
    if (timeChart) timeChart.destroy();
    timeChart = new Chart(document.getElementById('timeChart'), {
      type: 'line',
      data: { labels: sortedDates, datasets: [{ label: 'Inspections per Day', data: sortedDates.map(d => dateCounts[d]), borderColor: '#28a745' }] },
      options: { scales: { y: { beginAtZero: true } }, plugins: { title: { display: true, text: 'Inspection Trends' } } }
    });

    // Predictive Analytics with LSTM
    if (sortedDates.length >= 5) { // Need enough data for sequences
      const seqLength = 3;
      const countsArray = sortedDates.map(d => dateCounts[d]);
      const {xs, ys} = createTimeSeriesData(countsArray, seqLength);
      const model = await trainLSTMModel(xs, ys);

      // Predict future
      let lastSeq = countsArray.slice(-seqLength).map(c => [c]);
      const futureDays = 7;
      const predictions = [];
      for (let i = 0; i < futureDays; i++) {
        const predTensor = model.predict(tf.tensor3d([lastSeq]));
        const pred = await predTensor.dataSync()[0];
        predictions.push(Math.max(0, Math.round(pred)));
        lastSeq = [...lastSeq.slice(1), [pred]];
      }

      const futureDates = [];
      const lastDate = new Date(sortedDates[sortedDates.length - 1]);
      for (let i = 1; i <= futureDays; i++) {
        const nextDate = new Date(lastDate);
        nextDate.setDate(nextDate.getDate() + i);
        futureDates.push(nextDate.toISOString().split('T')[0]);
      }

      if (predictionChart) predictionChart.destroy();
      predictionChart = new Chart(document.getElementById('predictionChart'), {
        type: 'line',
        data: {
          labels: [...sortedDates, ...futureDates],
          datasets: [
            { label: 'Historical Inspections', data: [...countsArray, ...Array(futureDays).fill(null)], borderColor: '#28a745' },
            { label: 'Predicted Inspections', data: [...Array(countsArray.length).fill(null), ...predictions], borderColor: '#ff7733', borderDash: [5, 5] }
          ]
        },
        options: { scales: { y: { beginAtZero: true } }, plugins: { title: { display: true, text: 'Future Inspection Predictions' } } }
      });
    } else {
      const predictionCtx = document.getElementById('predictionChart').getContext('2d');
      predictionCtx.clearRect(0, 0, predictionCtx.canvas.width, predictionCtx.canvas.height);
      predictionCtx.fillText('Insufficient data for predictions', 10, 50);
    }
  } catch (error) {
    console.error(error);
    alert('Error generating reports: ' + error.message);
  } finally {
    reportArea.classList.remove('loading');
  }
};

window.exportToCSV = () => {
  let csv = ['Date,Driver,Truck,Company,Phone,Email,Time In,Time Out,Checklist'];
  allData.forEach(r => {
    const checklist = r.checklist ? r.checklist.map(i => `${i.item}:${i.present ? 'Present' : 'Missing'}:${i.note || ''}`).join('; ') : '';
    csv.push(`${r.date},${r.driver},${r.truck},${r.company},${r.phone},${r.email},${r.timeIn},${r.timeOut},"${checklist}"`);
  });
  const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reports.csv';
  a.click();
};

window.exportToPDF = () => {
  html2pdf(document.getElementById('reportArea'), { filename: 'reports.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 } });
};
</script>

</body>
</html>
