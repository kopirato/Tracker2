<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kitengela Car Park - Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary-purple: #6a1b9a;
  --secondary-purple: #ab47bc;
  --text-light: #fff;
  --bg-dark: #121212;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --border-color: rgba(255, 255, 255, 0.1);
  --shadow-color: rgba(0, 0, 0, 0.5);
  --hover-shadow: rgba(171, 71, 188, 0.3);
  --blur-amount: 10px;
}

body {
  margin: 0;
  background: linear-gradient(180deg, #0a0015, #1a0030);
  font-family: 'Inter', sans-serif;
  color: var(--text-light);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.navbar {
  background: linear-gradient(90deg, var(--primary-purple), var(--secondary-purple));
  display: flex;
  justify-content: space-around;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 12px var(--shadow-color);
}

.navbar a {
  color: var(--text-light);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s ease;
}

.navbar a:hover {
  color: #ffd700;
}

.app {
  max-width: 1200px;
  margin: 30px auto;
  background: var(--glass-bg);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 12px 30px var(--shadow-color);
  backdrop-filter: blur(var(--blur-amount));
  border: 1px solid var(--border-color);
  transition: box-shadow 0.3s ease;
  position: relative;
}

.app:hover {
  box-shadow: 0 16px 40px var(--hover-shadow);
}

h2 {
  text-align: center;
  color: var(--text-light);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

#searchInput {
  width: 100%;
  padding: 12px;
  margin-bottom: 20px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: var(--glass-bg);
  color: var(--text-light);
  backdrop-filter: blur(var(--blur-amount));
  box-sizing: border-box;
  transition: border-color 0.3s ease;
}

#searchInput:focus {
  border-color: var(--secondary-purple);
  outline: none;
}

.records-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.record-card {
  background: var(--glass-bg);
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 4px 12px var(--shadow-color);
  backdrop-filter: blur(var(--blur-amount));
  border: 1px solid var(--border-color);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
  height: 200px; /* To mimic image aspect */
}

.record-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(106, 27, 154, 0.4), rgba(171, 71, 188, 0.4));
  opacity: 0.7;
  z-index: -1;
  filter: blur(5px);
}

.record-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px var(--hover-shadow);
}

.record-card h3 {
  font-size: 16px;
  margin-bottom: 10px;
  color: var(--text-light);
}

.record-card p {
  font-size: 14px;
  margin: 5px 0;
  color: rgba(255, 255, 255, 0.8);
}

.play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  padding: 15px;
  font-size: 24px;
  color: var(--text-light);
  opacity: 0;
  transition: opacity 0.3s ease;
  cursor: pointer;
}

.record-card:hover .play-icon {
  opacity: 1;
}

.details {
  display: none;
  margin-top: 10px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 8px;
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  box-sizing: border-box;
}

.view-btn {
  display: none; /* Use play icon instead */
}

.sidebar {
  position: fixed;
  right: 20px;
  top: 80px;
  width: 250px;
  background: var(--glass-bg);
  padding: 15px;
  border-radius: 12px;
  backdrop-filter: blur(var(--blur-amount));
  border: 1px solid var(--border-color);
  z-index: 10;
}

.sidebar h4 {
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 10px;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar li {
  margin: 8px 0;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  transition: color 0.3s;
}

.sidebar li:hover {
  color: var(--text-light);
}

.filter-bar {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-top: 30px;
  flex-wrap: wrap;
  gap: 20px;
}

.filter-bar label {
  font-size: 12px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.8);
  margin-right: 10px;
}

.filter-select {
  background: var(--glass-bg);
  border: 1px solid var(--border-color);
  color: var(--text-light);
  padding: 10px;
  border-radius: 12px;
  backdrop-filter: blur(var(--blur-amount));
  min-width: 150px;
}

.buttons {
  margin: 30px 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  background: var(--secondary-purple);
  color: var(--text-light);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px var(--hover-shadow);
}

@media screen and (max-width: 768px) {
  .app {
    margin: 15px;
    padding: 20px;
    border-radius: 15px;
  }

  .records-grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
  }

  .filter-bar {
    flex-direction: column;
    align-items: flex-start;
  }

  .filter-select {
    width: 100%;
  }

  .sidebar {
    position: static;
    width: auto;
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html"> Home</a>
  <a href="records.html"> Records</a>
  <a href="reports.html"> Reports</a>
</div>

<div class="app">
<h2>Records</h2>

<input type="text" id="searchInput" placeholder="Search by driver, truck, company...">

<div class="records-grid" id="recordsGrid"></div>

<div class="filter-bar">
  <label>Genre</label>
  <select class="filter-select">
    <option>Select Genre</option>
  </select>
  <label>Artist</label>
  <select class="filter-select">
    <option>All Artists</option>
  </select>
  <label>Filter</label>
  <select class="filter-select">
    <option>All Artists</option>
  </select>
  <label>Year</label>
  <input type="text" class="filter-select" placeholder="Search">
</div>

<div class="buttons">
  <button class="export" onclick="exportToCSV()"> Export to CSV</button>
</div>

</div>

<div class="sidebar">
  <h4>Recently Added</h4>
  <ul>
    <li>Favorites</li>
    <li>Phoyjlemen</li>
    <li>Jumes</li>
    <li>Sepicy</li>
    <li>Comalies</li>
    <li>Souden</li>
    <li>Top Rated</li>
  </ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1_XDySLab5nhIcM-EhaV59ewtbjGOmQs",
  authDomain: "parking-b279f.firebaseapp.com",
  databaseURL: "https://parking-b279f-default-rtdb.firebaseio.com",
  projectId: "parking-b279f",
  storageBucket: "parking-b279f.firebasestorage.app",
  messagingSenderId: "718698334788",
  appId: "1:718698334788:web:549a3fc934233daa838a11"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const recordsRef = ref(db, 'inspections');

onValue(recordsRef, (snapshot) => {
  const data = snapshot.val();
  const grid = document.getElementById('recordsGrid');
  grid.innerHTML = '';
  if (data) {
    Object.entries(data).forEach(([id, record]) => {
      if (!record.date && !record.driver) return; // Skip empty records
      const checklistSummary = record.checklist ? record.checklist.map(item => `${item.item}: ${item.present ? 'Present' : 'Missing'} (${item.note || 'N/A'})`).join('
') : '';
      const missingCount = record.checklist ? record.checklist.filter(item => !item.present).length : 0;
      const totalItems = record.checklist ? record.checklist.length : 0;
      const summaryText = `${totalItems - missingCount}/${totalItems} items OK`;
      
      const card = document.createElement('div');
      card.classList.add('record-card');
      card.dataset.record = JSON.stringify(record);
      card.innerHTML = `
        <h3>${record.date || ''} - ${record.driver || ''}</h3>
        <p>Truck: ${record.truck || ''}</p>
        <p>Company: ${record.company || ''}</p>
        <p>Summary: ${summaryText}</p>
        <div class="play-icon" onclick="toggleDetails('${id}')"></div>
        <div class="details" id="details-${id}">${checklistSummary}</div>
      `;
      grid.appendChild(card);
    });
  } else {
    grid.innerHTML = '<p style="grid-column: span 4; text-align: center;">No records found.</p>';
  }
});

// Search functionality
document.getElementById('searchInput').addEventListener('keyup', function() {
  const filter = this.value.toLowerCase();
  const cards = document.querySelectorAll('.record-card');
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(filter) ? '' : 'none';
  });
});

// Toggle details
window.toggleDetails = (id) => {
  const details = document.getElementById(`details-${id}`);
  details.style.display = details.style.display === 'block' ? 'none' : 'block';
};

// Export to CSV
window.exportToCSV = () => {
  const cards = document.querySelectorAll('.record-card');
  let csv = ['Date,Driver,Truck,Company,Phone,Email,Time In,Time Out,Checklist Summary'];
  cards.forEach(card => {
    const record = JSON.parse(card.dataset.record);
    const summary = record.checklist ? record.checklist.map(item => `${item.item}:${item.present ? 'Present' : 'Missing'}:${item.note || 'N/A'}`).join('; ') : '';
    csv.push(`${record.date || ''},${record.driver || ''},${record.truck || ''},${record.company || ''},${record.phone || ''},${record.email || ''},${record.timeIn || ''},${record.timeOut || ''},"${summary}"`);
  });
  const csvFile = new Blob([csv.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.download = 'inspections.csv';
  a.href = window.URL.createObjectURL(csvFile);
  a.click();
};
</script>

</body>
</html>
