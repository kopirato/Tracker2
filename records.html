<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kitengela Car Park – Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy:#0b2a4a;
  --blue:#1e88e5;
  --green:#2e7d32;
  --red:#c62828;
  --amber:#f9a825;
  --bg:#f4f7fb;
  --card:#ffffff;
  --border:#dfe3eb;
  --text:#243447;
  --shadow:rgba(0,0,0,.08);
}

/* ---------- BASE ---------- */
body{
  margin:0;
  background:var(--bg);
  font-family:Inter,sans-serif;
  color:var(--text);
}

/* ---------- NAVBAR ---------- */
.navbar{
  background:linear-gradient(90deg,var(--navy),var(--blue));
  padding:14px 20px;
  display:flex;
  justify-content:center;
  gap:40px;
  box-shadow:0 4px 12px var(--shadow);
}

.navbar a{
  color:#fff;
  text-decoration:none;
  font-weight:600;
  padding:6px 4px;
  position:relative;
  opacity:.85;
}

/* ACTIVE TAB */
.navbar a.active{
  opacity:1;
}

.navbar a.active::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:100%;
  height:3px;
  background:#fff;
  border-radius:6px;
}

/* ---------- CARD ---------- */
.app{
  max-width:1300px;
  margin:30px auto;
  background:var(--card);
  padding:30px;
  border-radius:14px;
  box-shadow:0 12px 30px var(--shadow);
}

h2{
  text-align:center;
  color:var(--navy);
  margin-bottom:20px;
}

/* ---------- SEARCH ---------- */
#searchInput{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  margin-bottom:20px;
}

/* ---------- TABLE ---------- */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#eef3fb;
  font-weight:600;
  padding:12px;
  border-bottom:2px solid var(--border);
}

td{
  padding:12px;
  border-bottom:1px solid var(--border);
}

tr:hover{
  background:#f9fbff;
}

/* ---------- BADGES ---------- */
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge.ok{
  background:#e8f5e9;
  color:var(--green);
}

.badge.warn{
  background:#fff8e1;
  color:var(--amber);
}

/* ---------- ACTIONS ---------- */
.actions{
  display:flex;
  gap:8px;
}

.action-btn{
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.view{background:#edf4ff;color:var(--navy);}
.edit{background:#e3f2fd;color:var(--blue);}
.delete{background:#fdecea;color:var(--red);}

/* ---------- DETAILS ---------- */
.details{
  display:none;
  background:#f6f9ff;
}

/* ---------- MODAL ---------- */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#fff;
  padding:25px;
  border-radius:12px;
  width:400px;
}

.modal-content input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

.modal-content button{
  width:100%;
  padding:12px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- ✅ NAVIGATION FIXED -->
<div class="navbar">
  <a href="index.html" data-page="index">🏠 Home</a>
  <a href="records.html" data-page="records">📋 Records</a>
  <a href="reports.html" data-page="reports">📊 Reports</a>
</div>

<div class="app">
<h2>Inspection Records</h2>

<input id="searchInput" placeholder="Search driver, truck, company...">

<table id="recordsTable">
<thead>
<tr>
  <th>Date</th>
  <th>Driver</th>
  <th>Truck</th>
  <th>Company</th>
  <th>Status</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="recordsBody"></tbody>
</table>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Record</h3>
    <input id="editDriver" placeholder="Driver">
    <input id="editTruck" placeholder="Truck">
    <input id="editCompany" placeholder="Company">
    <button onclick="saveEdit()">Save Changes</button>
  </div>
</div>

<script type="module">
/* ---------- ACTIVE TAB LOGIC ---------- */
const page = location.pathname.split('/').pop();
document.querySelectorAll('.navbar a').forEach(link=>{
  if(link.getAttribute('href') === page){
    link.classList.add('active');
  }
});

/* ---------- FIREBASE ---------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1_XDySLab5nhIcM-EhaV59ewtbjGOmQs",
  authDomain: "parking-b279f.firebaseapp.com",
  databaseURL: "https://parking-b279f-default-rtdb.firebaseio.com",
  projectId: "parking-b279f",
  storageBucket: "parking-b279f.firebasestorage.app",
  messagingSenderId: "718698334788",
  appId: "1:718698334788:web:549a3fc934233daa838a11"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const recordsRef = ref(db,'inspections');
let currentEditId=null;

/* ---------- LOAD RECORDS ---------- */
onValue(recordsRef,snap=>{
  const body=document.getElementById('recordsBody');
  body.innerHTML='';
  const data=snap.val();
  if(!data) return;

  Object.entries(data).forEach(([id,r])=>{
    const ok=r.checklist.filter(i=>i.present).length;
    const total=r.checklist.length;

    body.innerHTML+=`
      <tr>
        <td>${r.date}</td>
        <td>${r.driver}</td>
        <td>${r.truck}</td>
        <td>${r.company}</td>
        <td><span class="badge ${ok===total?'ok':'warn'}">${ok}/${total}</span></td>
        <td class="actions">
          <button class="action-btn view" onclick="toggleDetails('${id}')">View</button>
          <button class="action-btn edit" onclick="openEdit('${id}','${r.driver}','${r.truck}','${r.company}')">Edit</button>
          <button class="action-btn delete" onclick="deleteRecord('${id}')">Delete</button>
        </td>
      </tr>
      <tr id="details-${id}" class="details">
        <td colspan="6">
          ${r.checklist.map(i=>`${i.item}: ${i.present?'✔':'✖'} (${i.note||'N/A'})`).join('<br>')}
        </td>
      </tr>`;
  });
});

/* ---------- ACTIONS ---------- */
window.toggleDetails=id=>{
  const row=document.getElementById(`details-${id}`);
  row.style.display=row.style.display==='table-row'?'none':'table-row';
};

window.openEdit=(id,d,t,c)=>{
  currentEditId=id;
  editDriver.value=d;
  editTruck.value=t;
  editCompany.value=c;
  editModal.style.display='flex';
};

window.saveEdit=()=>{
  update(ref(db,`inspections/${currentEditId}`),{
    driver:editDriver.value,
    truck:editTruck.value,
    company:editCompany.value
  });
  editModal.style.display='none';
};

window.deleteRecord=id=>{
  if(confirm('Delete this record permanently?')){
    remove(ref(db,`inspections/${id}`));
  }
};

/* ---------- SEARCH ---------- */
searchInput.addEventListener('keyup',e=>{
  const v=e.target.value.toLowerCase();
  document.querySelectorAll('#recordsBody tr').forEach(r=>{
    r.style.display=r.textContent.toLowerCase().includes(v)?'':'none';
  });
});
</script>

</body>
</html>
