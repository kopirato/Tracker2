<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<style>
  body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  header {
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    background: #111;
    border-bottom: 1px solid #333;
  }

  #backBtn {
    position: absolute;
    left: 15px;
    top: 15px;
    padding: 8px 14px;
    background: #444;
    color: #fff;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  #adminBtn {
    position: absolute;
    right: 15px;
    top: 15px;
    padding: 8px 14px;
    background: #444;
    color: #fff;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  /* Item grid */
  #itemsContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 15px;
    padding: 20px;
  }

  .item-card {
    background: #111;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #222;
  }

  .item-card img {
    width: 100%;
    border-radius: 6px;
    height: 160px;
    object-fit: cover;
  }

  .actions {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
  }

  button {
    cursor: pointer;
  }

  /* Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .modal-box {
    background: #111;
    padding: 20px;
    width: 90%;
    max-width: 420px;
    border-radius: 10px;
    border: 1px solid #333;
  }

  input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 7px;
    margin-bottom: 12px;
    background: #222;
    border: 1px solid #333;
    color: white;
    border-radius: 6px;
  }

  .closeBtn {
    float: right;
    background: #822;
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
  }

  #spinner {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    justify-content: center;
    align-items: center;
    font-size: 22px;
  }
</style>
</head>
<body>

<header>MARKETPLACE</header>

<button id="backBtn" onclick="location.href='index.html'">BACK</button>
<button id="adminBtn">ADMIN</button>

<div id="itemsContainer"></div>

<!-- ADD / EDIT modal -->
<div id="itemModal" class="modal">
  <div class="modal-box">
    <button class="closeBtn" onclick="closeModal(itemModal)">X</button>
    <h3 id="modalTitle">Add Item</h3>

    <form id="itemForm">
      <input type="text" id="itemTitle" placeholder="Title">
      <input type="number" id="itemPrice" placeholder="Price">
      <select id="itemCategory">
        <option>General</option>
        <option>Electronics</option>
        <option>Clothes</option>
        <option>Livestock</option>
      </select>
      <textarea id="itemDesc" placeholder="Description"></textarea>
      <input type="text" id="itemContact" placeholder="Seller phone or WhatsApp">

      <label style="color:#ccc;">Image (optional)</label>
      <input type="file" id="itemImage" accept="image/*">

      <button type="submit" style="width:100%;background:#0a84ff;padding:10px;border:none;border-radius:6px;margin-top:10px;">SAVE</button>
    </form>
  </div>
</div>

<!-- SPINNER -->
<div id="spinner">Saving...</div>

<script>
/* -----------------------------
   Firebase config
------------------------------ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_APP.firebaseapp.com",
  databaseURL: "https://YOUR_APP.firebaseio.com",
  projectId: "YOUR_APP",
  storageBucket: "YOUR_APP.appspot.com",
  messagingSenderId: "000000000",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();
const itemsRef = db.ref("marketplace_items");

let isAdmin = false;
let editingKey = null;

/* Utility */
function showSpinner(){ spinner.style.display = "flex"; }
function hideSpinner(){ spinner.style.display = "none"; }
function openModal(m){ m.style.display = "flex"; }
function closeModal(m){ m.style.display = "none"; editingKey = null; itemForm.reset(); }

adminBtn.onclick = () => {
  const pass = prompt("Enter Admin Password:");
  if(pass === "0742147197" || pass === "0721235005") {
    isAdmin = true;
    alert("Admin logged in");
    loadItems();
  } else {
    alert("Incorrect password");
  }
};

/* Load items */
function loadItems(){
  itemsRef.on("value", snap=>{
    const data = snap.val() || {};
    const list = Object.entries(data).map(([key,val])=>({key,...val}));
    renderItems(list);
  });
}

loadItems();

/* Render cards */
function renderItems(items){
  itemsContainer.innerHTML = "";
  items.forEach(item=>{
    const card = document.createElement("div");
    card.className = "item-card";

    card.innerHTML = `
      <img src="${item.imageUrl || ''}">
      <h3>${item.title}</h3>
      <p>KES ${item.price}</p>
      <p>${item.category}</p>
      <p>${item.desc}</p>
      <p>📞 ${item.contact}</p>

      ${ isAdmin ? `
      <div class="actions">
        <button onclick="editItem('${item.key}')">Edit</button>
        <button onclick="deleteItem('${item.key}','${item.imagePath || ''}')">Del</button>
      </div>` : "" }
    `;

    itemsContainer.appendChild(card);
  });
}

/* Edit */
function editItem(key){
  editingKey = key;
  itemsRef.child(key).once("value", snap=>{
    const d = snap.val();
    itemTitle.value = d.title;
    itemPrice.value = d.price;
    itemCategory.value = d.category;
    itemDesc.value = d.desc;
    itemContact.value = d.contact;
    modalTitle.innerText = "Edit Item";
    openModal(itemModal);
  });
}

/* Delete */
function deleteItem(key, imgPath){
  if(!confirm("Delete item?")) return;

  itemsRef.child(key).remove();

  if(imgPath){
    storage.ref(imgPath).delete();
  }
}

/* Save (Add + Edit) */
itemForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(!isAdmin){ alert("Admin only"); return; }

  const title = itemTitle.value.trim();
  const price = parseFloat(itemPrice.value) || 0;
  const category = itemCategory.value;
  const desc = itemDesc.value.trim();
  const contact = itemContact.value.trim();
  const file = itemImage.files[0];

  if(!title || price <= 0){
    alert("Enter valid title and price");
    return;
  }

  showSpinner();

  try {
    let imageUrl = "";
    let imagePath = "";

    if(file){
      const safe = Date.now() + "_" + file.name.replace(/[^a-z0-9\.\-_]/gi,"_");
      imagePath = "marketplace/" + safe;
      const ref = storage.ref(imagePath);
      const upload = await ref.put(file);
      imageUrl = await upload.ref.getDownloadURL();
    }

    const itemData = {
      title, price, category, desc, contact,
      imageUrl, imagePath,
      timestamp: Date.now()
    };

    if(editingKey){
      await itemsRef.child(editingKey).update(itemData);
    } else {
      await itemsRef.push(itemData);
    }

    closeModal(itemModal);
  }
  catch(err){
    console.error(err);
    alert("Error, see console.");
  }

  hideSpinner();
});
</script>

</body>
</html>
