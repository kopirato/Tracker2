<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace - Selelo Business Park</title>

<!-- Modern Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #000;
        color: #fff;
        overflow-x: hidden;
    }

    /* Beautiful glass-themed container */
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        margin-top: 40px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        backdrop-filter: blur(15px);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.06);
    }

    header {
        text-align: center;
        margin-top: 20px;
        padding: 15px 0;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: 1px;
        color: #00eaff;
        text-transform: uppercase;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 18px;
        margin-top: 20px;
        background: #111;
        border: 1px solid #00eaff;
        color: #00eaff;
        border-radius: 10px;
        text-decoration: none;
        font-size: 1rem;
        transition: 0.2s;
    }
    .back-btn:hover {
        background: #00eaff;
        color: #000;
    }

    h2 {
        margin-top: 30px;
        margin-bottom: 10px;
        font-weight: 700;
        color: #00eaff;
    }

    /* Input styling */
    input, textarea {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        outline: none;
    }

    input::placeholder, textarea::placeholder {
        color: #ccc;
    }

    /* Upload button */
    #uploadBtn {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: #00eaff;
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    #uploadBtn:hover {
        background: #03b6c8;
    }

    /* Marketplace item grid */
    .item-grid {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 15px;
        padding-bottom: 50px;
    }

    .item-card {
        background: rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(10px);
    }

    .item-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 12px;
    }

    .item-card h3 {
        margin-top: 10px;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .item-card p {
        margin: 6px 0;
        font-size: 0.93rem;
        color: #ddd;
    }

</style>
</head>
<body>

<header>MARKETPLACE</header>

<a href="index.html" class="back-btn">⬅ Back to Main App</a>

<div class="container">

    <h2>Add New Item</h2>

    <input type="text" id="title" placeholder="Item Name" />
    <input type="text" id="price" placeholder="Price (KES)" />
    <textarea id="desc" placeholder="Item description"></textarea>

    <input type="file" id="productImage" accept="image/*" />
    <button id="uploadBtn">Upload Item</button>

    <p id="uploadStatus"></p>
    <input type="hidden" id="imageURL">

    <h2>Marketplace Items</h2>
    <div class="item-grid" id="itemList">
        <!-- Items from Firestore appear here -->
    </div>

</div>

<script>
    // Firebase config (same as your main app)
    const firebaseConfig = {
        apiKey: "YOUR-API-KEY",
        authDomain: "YOUR-AUTH-DOMAIN",
        projectId: "YOUR-PROJECT-ID",
        storageBucket: "YOUR-STORAGE-BUCKET",
        messagingSenderId: "YOUR-SENDER-ID",
        appId: "YOUR-APP-ID"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const storage = firebase.storage();

    // Upload image + store item
    document.getElementById("uploadBtn").addEventListener("click", async function () {

        let file = document.getElementById("productImage").files[0];
        let title = document.getElementById("title").value.trim();
        let price = document.getElementById("price").value.trim();
        let desc = document.getElementById("desc").value.trim();

        if (!file) return alert("Select an image first");
        if (title === "" || price === "") return alert("Enter item name and price");

        let filePath = "marketplace/" + Date.now() + "_" + file.name;
        let uploadTask = storage.ref(filePath).put(file);

        uploadTask.on("state_changed",
            function (snapshot) {},
            function (error) { alert("Upload failed: " + error.message); },
            function () {
                uploadTask.snapshot.ref.getDownloadURL().then(function (url) {

                    // Save to Firestore
                    db.collection("marketplace").add({
                        title: title,
                        price: price,
                        description: desc,
                        image: url,
                        created: Date.now()
                    }).then(() => {
                        document.getElementById("uploadStatus").innerText = "✔ Uploaded Successfully!";
                        document.getElementById("uploadStatus").style.color = "lime";

                        loadMarketplace();
                    });
                });
            }
        );
    });

    // Load items from Firestore
    function loadMarketplace() {
        db.collection("marketplace").orderBy("created", "desc").onSnapshot(snapshot => {
            let container = document.getElementById("itemList");
            container.innerHTML = "";

            snapshot.forEach(doc => {
                let item = doc.data();

                let card = `
                    <div class="item-card">
                        <img src="${item.image}" />
                        <h3>${item.title}</h3>
                        <p>KES: ${item.price}</p>
                        <p>${item.description || ""}</p>
                    </div>
                `;

                container.innerHTML += card;
            });
        });
    }

    loadMarketplace();
</script>

</body>
</html>
