<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace - Selelo Business Park</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<!-- Firebase v8 (compat mode) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
    :root {
      --accent: #00eaff;
      --glass: rgba(255, 255, 255, 0.08);
    }
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #000 url('2.png') center/cover no-repeat fixed;
        color: #fff;
        min-height: 100vh;
    }
    body::before {
        content: ""; position: fixed; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.5));
        backdrop-filter: blur(3px);
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        position: relative;
        z-index: 2;
    }
    header {
        text-align: center;
        padding: 30px 0 10px;
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #00eaff, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .back-btn {
        display: block;
        width: fit-content;
        margin: 20px auto;
        padding: 12px 24px;
        background: rgba(0,238,255,0.15);
        border: 1px solid var(--accent);
        color: var(--accent);
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }
    .back-btn:hover { background: var(--accent); color: #000; }

    h2 {
        margin: 30px 0 16px;
        font-weight: 700;
        color: var(--accent);
        text-align: center;
    }

    input, textarea, button {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        color: #fff;
        font-size: 1rem;
    }
    input::placeholder, textarea::placeholder { color: #aaa; }

    #uploadBtn {
        background: var(--accent);
        color: #000;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
    }
    #uploadBtn:hover { background: #00c0d4; }

    .item-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .item-card {
        background: var(--glass);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        transition: 0.3s;
    }
    .item-card:hover { transform: translateY(-8px); }
    .item-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
    .item-info {
        padding: 16px;
        text-align: center;
    }
    .item-info h3 {
        margin: 0 0 8px;
        font-size: 1.2rem;
    }
    .item-info p {
        margin: 4px 0;
        opacity: 0.9;
    }
    .price {
        font-weight: bold;
        color: var(--accent);
        font-size: 1.3rem;
        margin: 10px 0;
    }
    footer {
        text-align: center;
        margin: 50px 0 20px;
        opacity: 0.7;
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<header>MARKETPLACE</header>

<a href="index.html" class="back-btn">← Back to Main App</a>

<div class="container">

    <h2>List Your Item</h2>
    <input type="text" id="title" placeholder="Item Name" required />
    <input type="number" id="price" placeholder="Price in KES" required />
    <textarea id="desc" rows="3" placeholder="Description (optional)"></textarea>
    <input type="file" id="productImage" accept="image/*" required />
    <button id="uploadBtn">Upload Item</button>
    <p id="uploadStatus" style="text-align:center;font-weight:bold;margin-top:10px"></p>

    <h2>Available Items</h2>
    <div class="item-grid" id="itemList">
        <!-- Items load here -->
    </div>

</div>

<footer>© David Kopirato • Selelo Business Park</footer>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyD1IrZScZZOZXEkWBM8WUDhKrnSTM89TIY",
      authDomain: "selelo-tracker.firebaseapp.com",
      projectId: "selelo-tracker",
      storageBucket: "selelo-tracker.fireasestorage.app",
      messagingSenderId: "42660826905",
      appId: "1:42660826905:web:b3074d71e00e2e0b9fbf88"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // CRITICAL FIX: You MUST update your Firestore rules in Firebase Console:
    // Go to: Firebase Console → Firestore Database → Rules → Publish this:
    /*
    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        match /marketplace/{itemId} {
          allow read: if true;
          allow write: if true;   // Change to 'if request.auth != null;' later for security
        }
      }
    }
    */

    document.getElementById("uploadBtn").addEventListener("click", async () => {
        const file = document.getElementById("productImage").files[0];
        const title = document.getElementById("title").value.trim();
        const price = document.getElementById("price").value.trim();
        const desc = document.getElementById("desc").value.trim();

        if (!file || !title || !price) {
            alert("Please fill all required fields and select an image");
            return;
        }

        const status = document.getElementById("uploadStatus");
        status.textContent = "Uploading...";
        status.style.color = "#00eaff";

        try {
            const filePath = "marketplace/" + Date.now() + "_" + file.name;
            const ref = storage.ref(filePath);
            await ref.put(file);
            const url = await ref.getDownloadURL();

            await db.collection("marketplace").add({
                title: title,
                price: price,
                description: desc,
                image: url,
                created: firebase.firestore.FieldValue.serverTimestamp()
            });

            status.textContent = "Uploaded successfully!";
            status.style.color = "lime";
            document.getElementById("title").value = "";
            document.getElementById("price").value = "";
            document.getElementById("desc").value = "";
            document.getElementById("productImage").value = "";
        } catch (err) {
            console.error(err);
            status.textContent = "Upload failed: " + err.message;
            status.style.color = "#ff0066";
        }
    });

    // Load all items in real-time
    function loadMarketplace() {
        db.collection("marketplace")
          .orderBy("created", "desc")
          .onSnapshot(snapshot => {
              const container = document.getElementById("itemList");
              container.innerHTML = snapshot.empty ? "<p style='text-align:center;grid-column:1/-1;opacity:0.7'>No items yet. Be the first to post!</p>" : "";

              snapshot.forEach(doc => {
                  const item = doc.data();
                  const card = document.createElement("div");
                  card.className = "item-card";
                  card.innerHTML = `
                      <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                      <div class="item-info">
                          <h3>${item.title}</h3>
                          <div class="price">KES ${Number(item.price).toLocaleString()}</div>
                          <p>${item.description || "No description"}</p>
                      </div>
                  `;
                  container.appendChild(card);
              });
          }, err => {
              console.error("Firestore load error:", err);
              document.getElementById("itemList").innerHTML = "<p style='color:#ff0066;text-align:center'>Error loading items. Check Firestore rules!</p>";
          });
    }

    loadMarketplace();
</script>

</body>
</html>
