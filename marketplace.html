<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #f5f5f5;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      outline: none;
    }

    input::placeholder, textarea::placeholder {
      color: #bbb;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ffcc00;
      font-weight: bold;
      color: #000;
      margin-top: 10px;
    }

    #backBtn {
      background: #444;
      color: #fff;
      margin-bottom: 20px;
    }

    #imagePreview {
      margin-top: 10px;
      width: 100%;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
<div class="container">

  <button id="backBtn" onclick="location.href='index.html'">⬅ Back to Home</button>
  <h2>Post to Marketplace</h2>

  <form id="marketForm">
    <input type="text" id="title" placeholder="Item Name" required />
    <textarea id="description" placeholder="Description" rows="4" required></textarea>
    <input type="number" id="price" placeholder="Price (KES)" required />

    <label style="color:#ccc;">Upload Image</label>
    <input type="file" id="itemImage" accept="image/*" />

    <img id="imagePreview" src="#" alt="Preview" />

    <button type="submit">Upload Item</button>
  </form>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PID",
    storageBucket: "YOUR_BUCKET",
    messagingSenderId: "YOUR_SENDER",
    appId: "YOUR_APPID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  const imgInput = document.getElementById("itemImage");
  const imgPreview = document.getElementById("imagePreview");

  imgInput.addEventListener("change", function(){
    const file = this.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = e => {
        imgPreview.src = e.target.result;
        imgPreview.style.display = "block";
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById("marketForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const title = document.getElementById("title").value;
    const desc = document.getElementById("description").value;
    const price = document.getElementById("price").value;
    const file = document.getElementById("itemImage").files[0];

    let imageURL = "";

    if(file){
      const ref = storage.ref(`marketplace/${Date.now()}_${file.name}`);
      await ref.put(file);
      imageURL = await ref.getDownloadURL();
    }

    await db.collection("marketplace").add({
      title,
      desc,
      price,
      imageURL,
      createdAt: new Date()
    });

    alert("Item uploaded!");
    location.reload();
  });
</script>
</body>
</html>
