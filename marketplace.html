<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace - Selelo</title>
  <meta name="theme-color" content="#1A120B">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Firebase v9 Modular - The ONLY version that works reliably now -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1IrZScZZOZXEkWBM8WUDhKrnSTM89TIY",
      authDomain: "selelo-tracker.firebaseapp.com",
      projectId: "selelo-tracker",
      storageBucket: "selelo-tracker.appspot.com",
      messagingSenderId: "42660826905",
      appId: "1:42660826905:web:b3074d71e00e2e0b9fbf88"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('uploadStatus');

    uploadBtn.addEventListener('click', async () => {
      const file = document.getElementById('productImage').files[0];
      const title = document.getElementById('title').value.trim();
      const price = document.getElementById('price').value.trim();
      const desc = document.getElementById('desc').value.trim();

      if (!file || !title || !price) {
        status.textContent = "Please fill all fields + choose image";
        status.style.color = "#ff3366";
        return;
      }

      uploadBtn.disabled = true;
      status.textContent = "Uploading...";
      status.style.color = "#E2725B";

      try {
        const filePath = `marketplace/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
        const storageRef = ref(storage, filePath);
        
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        await addDoc(collection(db, "marketplace"), {
          title,
          price: Number(price),
          description: desc,
          image: url,
          created: serverTimestamp()
        });

        status.textContent = "Posted successfully!";
        status.style.color = "#4ade80";

        // Clear form
        document.getElementById('title').value = '';
        document.getElementById('price').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('productImage').value = '';

      } catch (error) {
        console.error("Error:", error);
        status.textContent = "Failed: " + error.message;
        status.style.color = "#ff3366";
      } finally {
        uploadBtn.disabled = false;
      }
    });

    // Live load items
    onSnapshot(collection(db, "marketplace"), orderBy("created", "desc"), (snapshot) => {
      const list = document.getElementById('itemList');
      list.innerHTML = snapshot.empty ? `<p class="empty">No items yet.<br>Be the first to post!</p>` : '';

      snapshot.forEach(doc => {
        const item = doc.data();
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200/1A120B/666?text=No+Image'">
          <div class="item-info">
            <h3>${item.title}</h3>
            <div class="price">KES ${Number(item.price).toLocaleString()}</div>
            <p class="desc">${item.description || "No description"}</p>
          </div>
        `;
        list.appendChild(card);
      });
    }, (err) => {
      document.getElementById('itemList').innerHTML = `<p class="empty" style="color:#ff3366">Failed to load items<br>Check Firebase rules!</p>`;
    });
  </script>

  <style>
    :root {
      --bg: #1A120B;
      --accent: #E2725B;
      --accent2: #D4A574;
      --glass: rgba(255,255,255,0.07);
      --text: #F8F4F0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg) url('2.png') center/cover no-repeat fixed;
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(26,18,11,0.82), rgba(0,0,0,0.7));
      backdrop-filter: blur(4px);
    }

    /* Android App Bar */
    .appbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(26,18,11,0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 1000;
      border-bottom: 1px solid rgba(226,114,91,0.2);
    }
    .back { font-size: 32px; color: var(--accent); text-decoration: none; }
    .title { margin-left: 16px; font-size: 20px; font-weight: 700; }

    .container {
      padding: 76px 16px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin: 32px 0 20px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    input, textarea {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      color: var(--text);
      font-size: 16px;
    }

    #uploadBtn {
      width: 100%;
      padding: 18px;
      margin: 20px 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #000;
      border: none;
      border-radius: 14px;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(226,114,91,0.3);
    }
    #uploadBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #uploadStatus {
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      min-height: 30px;
      margin: 10px 0;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .item-card {
      background: var(--glass);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.3s;
    }
    .item-card:hover { transform: translateY(-8px); }
    .item-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .item-info {
      padding: 20px;
      text-align: center;
    }
    .item-info h3 {
      font-size: 1.35rem;
      margin-bottom: 8px;
    }
    .price {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--accent);
      margin: 10px 0;
    }
    .desc {
      opacity: 0.9;
      line-height: 1.4;
    }
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      opacity: 0.7;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Android-style Top Bar -->
  <div class="appbar">
    <a href="index.html" class="back">←</a>
    <div class="title">Marketplace</div>
  </div>

  <div class="container">

    <h2>List Your Item</h2>
    <input type="text" id="title" placeholder="Item Name" required />
    <input type="number" id="price" placeholder="Price in KES" required />
    <textarea id="desc" rows="3" placeholder="Description (optional)"></textarea>
    <input type="file" id="productImage" accept="image/*" required />
    <button id="uploadBtn">Upload Item</button>
    <div id="uploadStatus"></div>

    <h2>Available Items</h2>
    <div class="item-grid" id="itemList"></div>

  </div>

</body>
</html>
