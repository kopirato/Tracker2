<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Admin Editor</title>

<style>

/* GENERAL */

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f3f4f6;
}

/* ADMIN BAR */

.admin-bar{
background:#111;
color:#fff;
padding:10px 15px;
display:flex;
align-items:center;
justify-content:space-between;
}

.back-btn{
cursor:pointer;
opacity:.8;
font-size:14px;
}

.back-btn:hover{
opacity:1;
text-decoration:underline;
}

.badge{
background:#0d6efd;
padding:4px 8px;
border-radius:4px;
font-size:12px;
}

.admin-controls button{
margin-left:6px;
padding:6px 10px;
border:none;
border-radius:4px;
cursor:pointer;
}

.btn-dark{
background:#333;
color:#fff;
}

.btn-danger{
background:#dc3545;
color:#fff;
}

/* CONTENT */

.container{
max-width:900px;
margin:30px auto;
background:#fff;
padding:25px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
}

.editable{
border:1px dashed transparent;
padding:6px;
}

.editable[contenteditable="true"]{
border-color:#0d6efd;
background:#eef4ff;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.modal-box{
background:#fff;
padding:25px;
border-radius:8px;
width:300px;
text-align:center;
}

.modal-box input{
width:100%;
padding:8px;
margin:10px 0;
}

.modal-box button{
padding:8px 15px;
border:none;
border-radius:4px;
cursor:pointer;
}

.btn-primary{
background:#0d6efd;
color:#fff;
}

.btn-secondary{
background:#6c757d;
color:#fff;
}

</style>
</head>

<body>

<!-- ADMIN BAR -->

<div class="admin-bar">

<span class="back-btn" onclick="goBack()">⬅ Back</span>

<span class="badge" id="adminBadge">GUEST</span>

<div class="admin-controls">

<button class="btn-dark" id="loginBtn" onclick="openLogin()">
Admin Login
</button>

<button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none">
Logout
</button>

</div>

</div>

<!-- MAIN CONTENT -->

<div class="container">

<h1 class="editable" id="title">My Smart Website</h1>

<p class="editable" id="para1">
Welcome to this system. Login as admin to edit this content.
</p>

<p class="editable" id="para2">
This website supports editing, saving and restoring content.
</p>

</div>

<!-- LOGIN MODAL -->

<div class="modal" id="loginModal">

<div class="modal-box">

<h3>Admin Login</h3>

<input type="password" id="password" placeholder="Enter Password">

<button class="btn-primary" onclick="login()">Login</button>

<button class="btn-secondary" onclick="closeLogin()">Cancel</button>

</div>

</div>

<!-- SCRIPT -->

<script>

/* CONFIG */

const ADMIN_PASSWORD = "admin123"; // CHANGE THIS

let isAdmin = false;

/* BACK */

function goBack(){
if(history.length > 1){
history.back();
}else{
window.location.href="index.html";
}
}

/* LOGIN MODAL */

function openLogin(){
document.getElementById("loginModal").style.display="flex";
}

function closeLogin(){
document.getElementById("loginModal").style.display="none";
document.getElementById("password").value="";
}

/* LOGIN */

function login(){

const pass = document.getElementById("password").value;

if(pass === ADMIN_PASSWORD){

isAdmin = true;

localStorage.setItem("admin","true");

enableEdit();

closeLogin();

alert("Login successful");

}else{

alert("Wrong password");

}

}

/* LOGOUT */

function logout(){

isAdmin = false;

localStorage.removeItem("admin");

disableEdit();

alert("Logged out");

}

/* ENABLE EDITING */

function enableEdit(){

document.getElementById("adminBadge").innerText="ADMIN";

document.getElementById("loginBtn").style.display="none";
document.getElementById("logoutBtn").style.display="inline-block";

document.querySelectorAll(".editable").forEach(el=>{

el.contentEditable = true;

el.addEventListener("input",saveContent);

});

}

/* DISABLE EDITING */

function disableEdit(){

document.getElementById("adminBadge").innerText="GUEST";

document.getElementById("loginBtn").style.display="inline-block";
document.getElementById("logoutBtn").style.display="none";

document.querySelectorAll(".editable").forEach(el=>{

el.contentEditable = false;

});

}

/* SAVE */

function saveContent(){

const data = {
title: document.getElementById("title").innerHTML,
p1: document.getElementById("para1").innerHTML,
p2: document.getElementById("para2").innerHTML
};

localStorage.setItem("siteData",JSON.stringify(data));

}

/* LOAD */

function loadContent(){

const data = JSON.parse(localStorage.getItem("siteData"));

if(!data) return;

document.getElementById("title").innerHTML = data.title;
document.getElementById("para1").innerHTML = data.p1;
document.getElementById("para2").innerHTML = data.p2;

}

/* INIT */

function init(){

loadContent();

if(localStorage.getItem("admin")==="true"){

isAdmin=true;
enableEdit();

}else{

disableEdit();

}

}

init();

</script>

</body>
</html>
