<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace - Selelo Business Park</title>

<!-- PWA REQUIRED TAGS -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1A120B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<!-- Firebase v9 compat (updated & working) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #000;
        color: #fff;
        overflow-x: hidden;
        min-height: 100vh;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        margin-top: 40px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        backdrop-filter: blur(15px);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.06);
    }
    header {
        text-align: center;
        margin: 20px 0;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: 1px;
        color: #00eaff;
        text-transform: uppercase;
    }
    .back-btn {
        display: inline-block;
        padding: 10px 18px;
        margin: 20px;
        background: #111;
        border: 1px solid #00eaff;
        color: #00eaff;
        border-radius: 10px;
        text-decoration: none;
        font-size: 1rem;
        transition: 0.2s;
    }
    .back-btn:hover {
        background: #00eaff;
        color: #000;
    }
    h2 {
        margin-top: 30px;
        margin-bottom: 10px;
        font-weight: 700;
        color: #00eaff;
    }
    input, textarea {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        outline: none;
    }
    #uploadBtn {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: #00eaff;
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }
    #uploadBtn:hover { background: #03b6c8; }
    .item-grid {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 15px;
        padding-bottom: 50px;
    }
    .item-card {
        background: rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(10px);
    }
    .item-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 12px;
    }
    .item-card h3 { margin-top: 10px; font-size: 1.1rem; font-weight: 600; }
    .item-card p { margin: 6px 0; font-size: 0.93rem; color: #ddd; }

    /* Install Button */
    #installBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 14px 30px;
        background: linear-gradient(135deg, #E2725B, #D4A574);
        color: #042;
        border: none;
        border-radius: 50px;
        font-weight: 800;
        font-size: 16px;
        box-shadow: 0 8px 25px rgba(226,114,91,0.4);
        cursor: pointer;
        animation: pulse 2s infinite;
        display: none;
    }
    @keyframes pulse {
        0%,100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.05); }
    }
</style>
</head>
<body>

<header>MARKETPLACE</header>
<a href="index.html" class="back-btn">Back to Main App</a>

<div class="container">
    <h2>Add New Item</h2>
    <input type="text" id="title" placeholder="Item Name" />
    <input type="text" id="price" placeholder="Price (KES)" />
    <textarea id="desc" placeholder="Item description"></textarea>
    <input type="file" id="productImage" accept="image/*" />
    <button id="uploadBtn">Upload Item</button>
    <p id="uploadStatus"></p>
    <h2>Marketplace Items</h2>
    <div class="item-grid" id="itemList"></div>
</div>

<!-- INSTALL BUTTON -->
<button id="installBtn">Install Selelo App</button>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyD1IrZScZZOZXEkWBM8WUDhKrnSTM89TIY",
        authDomain: "selelo-tracker.firebaseapp.com",
        projectId: "selelo-tracker",
        storageBucket: "selelo-tracker.firebasestorage.app",
        messagingSenderId: "42660826905",
        appId: "1:42660826905:web:b3074d71e00e2e0b9fbf88"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';  // SHOW BUTTON ON MOBILE
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            console.log('User installed the app');
        }
        deferredPrompt = null;
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW failed:', err));
        });
    }

    // Upload Item
    document.getElementById("uploadBtn").addEventListener("click", async () => {
        const file = document.getElementById("productImage").files[0];
        const title = document.getElementById("title").value.trim();
        const price = document.getElementById("price").value.trim();
        const desc = document.getElementById("desc").value.trim();

        if (!file || !title || !price) return alert("Fill all fields + select image");

        const filePath = "marketplace/" + Date.now() + "_" + file.name;
        const ref = storage.ref(filePath);
        await ref.put(file);
        const url = await ref.getDownloadURL();

        await db.collection("marketplace").add({
            title, price, description: desc, image: url, created: Date.now()
        });

        document.getElementById("uploadStatus").innerHTML = "Uploaded Successfully!";
        document.getElementById("uploadStatus").style.color = "lime";
        document.getElementById("title").value = document.getElementById("price").value = document.getElementById("desc").value = "";
        document.getElementById("productImage").value = "";
    });

    // Load Items
    function loadMarketplace() {
        db.collection("marketplace").orderBy("created", "desc").onSnapshot(snapshot => {
            const container = document.getElementById("itemList");
            container.innerHTML = "";
            snapshot.forEach(doc => {
                const item = doc.data();
                container.innerHTML +=
                    `<div class="item-card">
                        <img src="${item.image}" alt="${item.title}">
                        <h3>${item.title}</h3>
                        <p>KES ${item.price}</p>
                        <p>${item.description || ""}</p>
                    </div>`;
            });
        });
    }
    loadMarketplace();
</script>
</body>
</html>
