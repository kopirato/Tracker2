<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SELELO BUSINESS PARK</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter,sans-serif;
background:#1A120B url('2.png') center/cover fixed;
color:#fff;
margin:0;
padding:0;
}

.card{
max-width:1200px;
margin:20px auto;
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:20px;
backdrop-filter:blur(12px);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

button{
padding:6px 12px;
border-radius:8px;
border:none;
cursor:pointer;
}

.btn-admin{
background:#E2725B;
color:#000;
font-weight:bold;
}

.btn-ghost{
background:transparent;
border:1px solid #aaa;
color:#fff;
}

.delete-btn{
background:#D9534F;
color:#fff;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.modal.show{
display:flex;
}

.modal-panel{
background:#222;
padding:20px;
border-radius:15px;
width:90%;
max-width:400px;
}

input,select,textarea{
width:100%;
padding:8px;
border-radius:8px;
border:1px solid #777;
background:transparent;
color:#fff;
}
</style>
</head>

<body>

<div class="card">

<h2>SELELO BUSINESS PARK</h2>
<p>The BizHub – Modern Workspace Solutions</p>

<button id="adminBtn" class="btn-admin">Admin Login</button>

<hr>

<h3>Add Transaction</h3>

<input id="txDate" type="date"><br><br>

<select id="txType">
<option>Income</option>
<option>Expense</option>
</select><br><br>

<select id="txCategory"></select><br><br>

<input id="txAmount" type="number" placeholder="Amount"><br><br>

<textarea id="txNotes" placeholder="Notes"></textarea><br><br>

<button id="addBtn" class="btn-admin" disabled>Add</button>
<button id="clearBtn" class="btn-ghost">Clear</button>

<div id="txMsg"></div>

<hr>

<h3>Transactions</h3>

<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Category</th>
<th>Amount</th>
<th>Notes</th>
<th>Action</th>
</tr>
</thead>

<tbody id="txTbody"></tbody>
</table>

<hr>

<h3>Summary</h3>

<p>Income: <b id="statIncome">0</b></p>
<p>Expense: <b id="statExpense">0</b></p>
<p>Balance: <b id="statBalance">0</b></p>

<button id="exportCsv" class="btn-ghost">Export CSV</button>

</div>


<!-- Admin Modal -->
<div id="adminModal" class="modal">
<div class="modal-panel">

<h3>Admin Login</h3>

<input id="adminPassword" type="password" placeholder="Password"><br><br>

<button id="adminConfirm" class="btn-admin">Login</button>
<button id="adminCancel" class="btn-ghost">Cancel</button>

</div>
</div>


<!-- Edit Modal -->
<div id="editModal" class="modal">
<div class="modal-panel">

<h3>Edit</h3>

<input id="editDate" type="date"><br><br>

<select id="editType">
<option>Income</option>
<option>Expense</option>
</select><br><br>

<select id="editCategory"></select><br><br>

<input id="editAmount" type="number"><br><br>

<textarea id="editNotes"></textarea><br><br>

<button id="editSaveBtn" class="btn-admin">Save</button>
<button id="editCancelBtn" class="btn-ghost">Cancel</button>

</div>
</div>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

document.addEventListener('DOMContentLoaded',()=>{

/* Firebase */
const firebaseConfig={
apiKey:"AIzaSyD1IrZScZZOZXEkWBM8WUDhKrnSTM89TIY",
authDomain:"selelo-tracker.firebaseapp.com",
projectId:"selelo-tracker",
storageBucket:"selelo-tracker.firebasestorage.app",
messagingSenderId:"42660826905",
appId:"1:42660826905:web:b3074d71e00e2e0b9fbf88"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const txRef=db.ref('transactions');


/* Constants */
const KEY_TX="selelo_tx_local";
const KEY_ADMIN="selelo_admin";
const ADMIN_PASSWORDS=["0742147197","0721235005"];


/* Data */
let transactions=JSON.parse(localStorage.getItem(KEY_TX)||"[]");
let isAdmin=localStorage.getItem(KEY_ADMIN)==="true";
let editKey=null;


/* Elements */
const els={
adminBtn:adminBtn,
addBtn:addBtn,
clearBtn:clearBtn,
txDate:txDate,
txType:txType,
txCategory:txCategory,
txAmount:txAmount,
txNotes:txNotes,
txMsg:txMsg,
txTbody:txTbody,

statIncome:statIncome,
statExpense:statExpense,
statBalance:statBalance,

exportCsv:exportCsv,

adminModal:adminModal,
adminPassword:adminPassword,
adminConfirm:adminConfirm,
adminCancel:adminCancel,

editModal:editModal,
editDate:editDate,
editType:editType,
editCategory:editCategory,
editAmount:editAmount,
editNotes:editNotes,
editSaveBtn:editSaveBtn,
editCancelBtn:editCancelBtn
};


/* Categories */
const incomeCategories=[
'Room Rental','Parking Fees','Sales','Other Income'
];

const expenseCategories=[
'Office rent','Repairs','Electricity','Internet','Other expenses'
];


/* Utils */
function esc(s){
return String(s||'').replace(/[&<>"']/g,m=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));
}

function saveLocal(){
localStorage.setItem(KEY_TX,JSON.stringify(transactions));
}


/* Categories Update */
function updateCategories(sel,type){

sel.innerHTML="";

const cats=type==="Expense"?expenseCategories:incomeCategories;

cats.forEach(c=>{
const o=document.createElement("option");
o.value=c;
o.textContent=c;
sel.appendChild(o);
});
}

updateCategories(txCategory,"Income");
updateCategories(editCategory,"Income");

txType.onchange=()=>updateCategories(txCategory,txType.value);
editType.onchange=()=>updateCategories(editCategory,editType.value);


/* Admin UI */
function setAdmin(v){

isAdmin=v;
localStorage.setItem(KEY_ADMIN,v);

addBtn.disabled=!v;

adminBtn.textContent=v?"Admin (Logout)":"Admin Login";

render();
}

setAdmin(isAdmin);


/* Firebase Sync */
txRef.on("value",snap=>{

const d=snap.val();

if(d){
transactions=Object.keys(d).map(k=>({key:k,...d[k]}));
saveLocal();
render();
}

});


/* Add */
addBtn.onclick=()=>{

if(!isAdmin) return alert("Admin only");

const t={
date:txDate.value,
type:txType.value,
category:txCategory.value,
amount:Number(txAmount.value),
notes:txNotes.value
};

if(!t.date||!t.amount) return alert("Fill fields");

txRef.push(t);

txDate.value="";
txAmount.value="";
txNotes.value="";
};


/* Clear */
clearBtn.onclick=()=>{
txDate.value="";
txAmount.value="";
txNotes.value="";
};


/* Render */
function render(){

txTbody.innerHTML="";

let inc=0,exp=0;

transactions.forEach(t=>{

const tr=document.createElement("tr");

let act=`<button data-a="r" data-k="${t.key}">Receipt</button>`;

if(isAdmin){
act=`
<button data-a="e" data-k="${t.key}">Edit</button>
<button class="delete-btn" data-a="d" data-k="${t.key}">Delete</button>
`;
}

tr.innerHTML=`
<td>${esc(t.date)}</td>
<td>${esc(t.type)}</td>
<td>${esc(t.category)}</td>
<td>KES ${Number(t.amount).toLocaleString()}</td>
<td>${esc(t.notes||"")}</td>
<td>${act}</td>
`;

txTbody.appendChild(tr);

if(t.type==="Income") inc+=Number(t.amount);
if(t.type==="Expense") exp+=Number(t.amount);

});

statIncome.textContent=inc.toLocaleString();
statExpense.textContent=exp.toLocaleString();
statBalance.textContent=(inc-exp).toLocaleString();

}

render();


/* Table Actions */
txTbody.onclick=e=>{

const b=e.target;
if(!b.dataset.a) return;

const k=b.dataset.k;

if(b.dataset.a==="d"){
if(!confirm("Delete?")) return;
txRef.child(k).remove();
}

if(b.dataset.a==="e"){
openEdit(k);
}

};


/* Edit */
function openEdit(k){

editKey=k;

const t=transactions.find(x=>x.key===k);

if(!t) return;

editDate.value=t.date;
editType.value=t.type;

updateCategories(editCategory,t.type);

editCategory.value=t.category;
editAmount.value=t.amount;
editNotes.value=t.notes;

editModal.classList.add("show");
}

editCancelBtn.onclick=()=>{
editModal.classList.remove("show");
};

editSaveBtn.onclick=()=>{

const t={
date:editDate.value,
type:editType.value,
category:editCategory.value,
amount:Number(editAmount.value),
notes:editNotes.value
};

txRef.child(editKey).update(t);

editModal.classList.remove("show");
};


/* CSV */
exportCsv.onclick=()=>{

let csv="Date,Type,Category,Amount,Notes\n";

transactions.forEach(t=>{
csv+=`"${t.date}","${t.type}","${t.category}","${t.amount}","${(t.notes||"").replace(/"/g,'""')}"\n`;
});

const blob=new Blob([csv],{type:"text/csv"});
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="transactions.csv";
a.click();

};


/* Admin */
adminBtn.onclick=()=>{

if(isAdmin){
setAdmin(false);
return;
}

adminModal.classList.add("show");
};

adminCancel.onclick=()=>{
adminModal.classList.remove("show");
};

adminConfirm.onclick=()=>{

if(!ADMIN_PASSWORDS.includes(adminPassword.value)){
return alert("Wrong password");
}

adminModal.classList.remove("show");
setAdmin(true);
};

});
</script>

</body>
</html>
